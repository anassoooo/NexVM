# Backend-only local development. Use ../docker-compose.yml for the full stack.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexvm-backend
    ports:
      - "8001:8000"
    env_file:
      - ./.env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - nexvm-network

