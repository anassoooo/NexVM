name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Settings requires these; tests mock Supabase, Groq and VBoxManage.
      SUPABASE_URL: https://ci.supabase.co
      SUPABASE_SECRET_KEY: sb_secret_ci_placeholder
      GROQ_API_KEY: gsk_ci_placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/dev-requirements.txt
      - run: pip install -r requirements.txt -r dev-requirements.txt
      - run: ruff check .
      # VirtualBox isn't installed on the runner, so integration tests skip themselves.
      - run: pytest -q

  frontend:
    name: Frontend (tsc + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # NEXT_PUBLIC_* values are embedded at build time; placeholders are enough to compile.
      NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_API_URL: http://localhost:8001
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
